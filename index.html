<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10152d">
<title>品格勇士：恩典試煉</title>
<style>
:root{--bg:#10152d;--gold:#ffd166;--green:#68dda0;--red:#ff8181;--text:#f5f6ff;--muted:#aab4d5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#293b68,#10152d 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100vh;padding:16px}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:13px;padding:13px 16px;font-weight:800;background:linear-gradient(135deg,#ffd166,#f5a623);color:#222;cursor:pointer}
button:disabled{opacity:.4}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #53638e;background:#111a35;color:#fff;font-size:16px;outline:none;margin-top:8px}
textarea{min-height:70px;resize:vertical}
.app{max-width:720px;margin:auto}
header{text-align:center;padding:16px 0 22px}
.logo{font-size:52px}
h1{font-size:27px;color:var(--gold);margin:5px}
.subtitle{color:var(--muted);font-size:14px}
.panel{background:linear-gradient(145deg,#202b50,#18213f);border:1px solid #394873;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 12px 30px #0004}
h2{font-size:21px;margin:0 0 15px;color:var(--gold)}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.btn2{background:#34456f;color:#fff}
.btnDanger{background:#963d52;color:#fff}
.player{background:#121d3b;border:1px solid #40527e;border-radius:13px;padding:12px;margin-top:9px;display:flex;align-items:center;gap:9px}
.playerName{font-weight:800}
.playerInfo{font-size:12px;color:#b9c7e8;line-height:1.5;margin-top:4px}
.playerText{flex:1;min-width:0}
.player button{padding:9px 12px;font-size:13px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.level{padding:16px 10px;border-radius:15px;background:#26375e;border:1px solid #4b6395;text-align:center;cursor:pointer}
.level.locked{opacity:.4;filter:grayscale(1)}
.level .emoji{font-size:27px}
.level strong{display:block;margin:5px}
.level small{color:#bdc9e9}
.progress{height:10px;background:#111a35;border-radius:20px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#52d69a,#ffd166);width:0}
.question{font-size:20px;line-height:1.6;font-weight:800;margin:18px 0}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#29385f;color:#fff;border:1px solid #536b9d;padding:15px;border-radius:13px;font-weight:600}
.option.correct{background:#176b4d;border-color:#68dda0}
.option.wrong{background:#853b4b;border-color:#ff8181}
.feedback{padding:14px;border-radius:12px;background:#111a35;margin-top:13px;line-height:1.6}
.hidden{display:none!important}
.center{text-align:center}
.bigScore{font-size:42px;color:var(--gold);font-weight:900}
.qitem{background:#121d3b;border:1px solid #40527e;border-radius:12px;padding:10px;margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.5}
.qitem div{flex:1;min-width:0}
.qitem button{padding:8px 11px;font-size:13px;flex:none}
footer{text-align:center;color:#8290b6;font-size:12px;padding:20px}
footer a{color:#8290b6;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🛡️</div><h1>品格勇士：恩典試煉</h1><div class="subtitle">在真理中學習，在恩典中成長</div></header>

<section id="home"><div class="panel">
  <h2>🧒 勇士管理</h2>
  <div class="row" style="gap:0;align-items:stretch">
    <input id="playerName" maxlength="20" placeholder="輸入姓名（點一下可清空）" style="flex:1;margin:0;border-radius:12px 0 0 12px">
    <div style="padding:14px 16px;background:#34456f;border:1px solid #53638e;border-left:0;border-radius:0 12px 12px 0;font-weight:900;white-space:nowrap;flex:none">勇士</div>
  </div>
  <div class="row" style="margin-top:10px"><button onclick="addPlayer()">＋ 新增勇士</button><button class="btn2" onclick="renamePlayer()">✓ 確認修改姓名</button></div>
  <div id="players"></div>
</div></section>

<section id="levelPage" class="hidden"><div class="panel">
  <div class="row"><h2 style="flex:1">⚔️ 十大試煉關卡</h2><button class="btn2" onclick="goHome()">返回</button></div>
  <div id="levelStats" class="small"></div>
  <div id="levelGrid" class="levels" style="margin-top:15px"></div>
</div></section>

<section id="quizPage" class="hidden"><div class="panel">
  <div class="row"><div><div class="small" id="quizLevel"></div><h2 id="quizTitle">勇士試煉</h2></div><button class="btn2" onclick="confirmExit()">離開</button></div>
  <div class="row small"><span id="questionCount"></span><span id="quizScore" style="text-align:right"></span></div>
  <div class="progress"><div id="progressBar"></div></div>
  <div id="questionText" class="question"></div>
  <div id="options"></div>
  <div id="feedback" class="feedback hidden"></div>
  <button id="nextBtn" style="width:100%;margin-top:15px" disabled onclick="nextQuestion()">確認答案</button>
</div></section>

<section id="resultPage" class="hidden"><div class="panel center">
  <div style="font-size:55px">🏆</div><h2 id="resultTitle">試煉完成</h2>
  <div class="bigScore" id="resultScore"></div><p id="resultMessage"></p>
  <button onclick="showLevels()" style="width:100%">返回關卡</button>
  <button class="btn2" onclick="goHome()" style="width:100%;margin-top:10px">返回首頁</button>
</div></section>

<section id="adminPage" class="hidden"><div class="panel">
  <div class="row"><h2 style="flex:1">🔧 題庫後台</h2><button class="btn2" onclick="goHome()">返回</button></div>
  <select id="aLevel"></select>
  <textarea id="aQ" placeholder="題目"></textarea>
  <input id="aRight" placeholder="✅ 正確答案">
  <input id="aW1" placeholder="❌ 錯誤答案 1">
  <input id="aW2" placeholder="❌ 錯誤答案 2">
  <input id="aW3" placeholder="❌ 錯誤答案 3">
  <textarea id="aExp" placeholder="解說（答題後顯示，可留空）"></textarea>
  <div class="row" style="margin-top:10px"><button onclick="saveQuestion()" id="aSave">＋ 新增題目</button><button class="btn2" onclick="clearForm()">清空</button></div>
  <h3 style="margin:22px 0 4px;color:var(--gold)">尚未寫入 questions.js 的新題目（<span id="aCount">0</span>）</h3>
  <div id="aList"></div>
  <button onclick="writeQuestionsFile()" style="width:100%;margin-top:14px">💾 寫入 questions.js</button>
  <div class="small" style="margin-top:6px">電腦版 Chrome／Edge：選擇你的 questions.js 後直接寫入。其他瀏覽器：會下載新的 questions.js，請用它取代舊檔。</div>
  <div class="row" style="margin-top:14px"><button class="btn2" onclick="exportQ()">匯出備份</button><button class="btn2" onclick="importQ()">匯入備份</button></div>
  <textarea id="aIO" placeholder="匯出的內容會出現在這裡；要匯入時貼上備份文字再按「匯入備份」"></textarea>
  <div class="small" style="margin-top:8px">新增題目先暫存在瀏覽器，按「寫入 questions.js」後才會成為題庫檔的一部分。每關從題庫隨機抽最多 25 題。</div>
</div></section>

<footer>品格勇士・恩典試煉｜學習聖經真理，培養美好品格<br><a onclick="openAdmin()">題庫後台</a></footer>
</div>

<script src="questions.js"></script>
<script>
const STORE="grace_knight_250_v1",CUSTOM="grace_knight_custom_v1",ADMIN_PIN="1234";
const LEVEL_NAMES=["創世與起初","摩西與出埃及","士師與君王","先知與信心","詩篇與智慧","耶穌的降生","耶穌的教導","耶穌的神蹟","使徒與教會","信仰與品格"];
const LEVEL_ICONS=["🌍","🌊","👑","🔥","📖","⭐","🕊️","✨","⛪","❤️"];
let baseRaw=(typeof raw!=="undefined"&&Array.isArray(raw))?raw:[];
function baseLevel(i){return Number(baseRaw[i][6])||Math.floor(i/25)+1}

let db=loadDB(),custom=loadCustom();
mergeDuplicates();
let current=null,activeLevel=0,quizItems=[],qIndex=0,rightCount=0,answered=false,quizMode="level",editingId=null;

function loadCustom(){try{const c=JSON.parse(localStorage.getItem(CUSTOM));return Array.isArray(c)?c:[]}catch(e){return []}}
function saveCustom(){try{localStorage.setItem(CUSTOM,JSON.stringify(custom));return true}catch(e){alert("儲存失敗：瀏覽器儲存空間不足。");return false}}
function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(STORE))||{players:{}};
    if(!d.players)d.players={};
    Object.values(d.players).forEach(p=>{p.records=p.records||{};p.answers=p.answers||{};p.wrongQuestions=p.wrongQuestions||{};p.unlocked=p.unlocked||1});
    return d;
  }catch(e){return {players:{}}}
}
function saveDB(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){alert("儲存失敗：可能是瀏覽器儲存空間不足，請勿清除網站資料。");return false}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cleanName(v){return String(v||"").trim().replace(/勇士$/,"").trim()}

/* ===== 題庫存取 ===== */
function customItem(c){return [c.q,c.a,c.w[0],c.w[1],c.w[2],c.exp||""]}
function getQ(id){
  if(String(id).startsWith("c")){const c=custom.find(x=>x.id===id);return c?customItem(c):null}
  return baseRaw[Number(id)]||null;
}
function levelPool(level){
  const pool=[];
  baseRaw.forEach((it,i)=>{if(baseLevel(i)===level)pool.push({id:i,item:it,sourceLevel:level})});
  custom.filter(c=>c.level===level).forEach(c=>pool.push({id:c.id,item:customItem(c),sourceLevel:level}));
  return pool;
}

/* ===== 勇士管理 ===== */
function makePlayer(name){return {name,score:0,unlocked:1,records:{},answers:{},wrongQuestions:{},created:Date.now()}}
function addPlayer(){
  const name=cleanName(document.getElementById("playerName").value);
  if(!name){alert("請先輸入小勇士姓名！");return}
  if(db.players[name]){alert("這個名字已經存在，請使用載入或修改姓名。");return}
  db.players[name]=makePlayer(name);current=name;
  document.getElementById("playerName").value="";
  saveDB();renderAll();showLevels();
}
function renamePlayer(){
  if(!current){alert("請先按某位勇士旁邊的「改名」！");return}
  const n=cleanName(document.getElementById("playerName").value);
  if(!n){alert("請輸入新姓名！");return}
  if(n===current){alert("新姓名與目前姓名相同。");return}
  if(db.players[n]){alert("這個姓名已經存在！");return}
  const p=db.players[current];db.players[n]=p;p.name=n;delete db.players[current];current=n;
  document.getElementById("playerName").value="";
  saveDB();renderAll();
  alert("勇士姓名已修改！原有積分及闖關紀錄完整保留。");
}
function editPlayerName(name){
  if(!db.players[name])return;
  current=name;
  const i=document.getElementById("playerName");
  i.dataset.keepValue="1";i.value=name;i.focus();i.setSelectionRange(0,i.value.length);renderAll();
}
function loadPlayer(name){
  if(!db.players[name]){alert("找不到這位勇士的資料，請重新整理後再試。");return}
  current=name;renderAll();showLevels();
}
function deletePlayer(name){
  if(!confirm("確定刪除「"+name+"勇士」的所有遊戲紀錄？"))return;
  delete db.players[name];if(current===name)current=null;saveDB();renderAll();
}
function renderAll(){
  const box=document.getElementById("players");box.innerHTML="";
  Object.keys(db.players).forEach(name=>{
    const p=db.players[name],div=document.createElement("div");div.className="player";
    const passed=Object.values(p.records||{}).filter(r=>r&&r.completed).length;
    const tw=document.createElement("div");tw.className="playerText";
    const sp=document.createElement("div");sp.className="playerName";sp.textContent="🛡️ "+name+"勇士";
    const info=document.createElement("div");info.className="playerInfo";
    info.textContent=`⭐ 積分：${getScore(p)} 分　🏅 已通過：${passed}/10 關`;
    tw.append(sp,info);
    const mk=(t,c,f)=>{const b=document.createElement("button");b.textContent=t;if(c)b.className=c;b.onclick=f;return b};
    div.append(tw,mk("改名","btn2",()=>editPlayerName(name)),mk("載入","",()=>loadPlayer(name)),mk("刪除","btnDanger",()=>deletePlayer(name)));
    box.appendChild(div);
  });
}
function getScore(p){let s=0;Object.values(p.records||{}).forEach(r=>s+=r.score||0);return s}
function highestCompleted(p){let h=0;for(let i=1;i<=10;i++)if(p.records[i]&&p.records[i].completed)h=i;return h}
function eligibleWrongItems(p){
  const done=highestCompleted(p);
  return Object.entries(p.wrongQuestions||{})
    .map(([id,info])=>({id,sourceLevel:Number(info.sourceLevel)||Math.floor(Number(id)/25)+1}))
    .filter(x=>x.sourceLevel<done&&getQ(x.id))
    .sort((a,b)=>a.sourceLevel-b.sourceLevel);
}

/* ===== 頁面 ===== */
function hidePages(){["home","levelPage","quizPage","resultPage","adminPage"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
function goHome(){hidePages();document.getElementById("home").classList.remove("hidden");renderAll()}
function showLevels(){
  if(!current){alert("請先新增或載入小勇士！");return}
  hidePages();document.getElementById("levelPage").classList.remove("hidden");
  const p=db.players[current];
  document.getElementById("levelStats").textContent=`${current}勇士｜累積積分 ${getScore(p)} 分｜已解鎖 ${p.unlocked}/10 關`;
  const grid=document.getElementById("levelGrid");grid.innerHTML="";
  LEVEL_NAMES.forEach((name,i)=>{
    const unlocked=i+1<=p.unlocked,rec=p.records[i+1],n=Math.min(25,levelPool(i+1).length);
    const div=document.createElement("div");div.className="level"+(unlocked?"":" locked");
    div.innerHTML=`<div class="emoji">${LEVEL_ICONS[i]}</div><strong>第 ${i+1} 關</strong>${escapeHTML(name)}<small>${rec?`最佳成績 ${rec.right}/${rec.total||25}`:`${n}題挑戰`}${unlocked?"":"｜🔒 未解鎖"}</small>`;
    if(unlocked)div.onclick=()=>startLevel(i+1);
    grid.appendChild(div);
  });
  const old=document.getElementById("reviewArea");if(old)old.remove();
  const wrong=eligibleWrongItems(p);
  if(wrong.length){
    const area=document.createElement("div");area.id="reviewArea";area.style.marginTop="16px";
    area.innerHTML=`<button class="btn2" style="width:100%">📚 錯題複習（${wrong.length} 題）</button><div class="small" style="margin-top:7px;text-align:center">完成下一關後，上一關答錯的題目才會開放複習</div>`;
    area.querySelector("button").onclick=startReview;
    grid.parentNode.appendChild(area);
  }
}

/* ===== 測驗 ===== */
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startLevel(level){
  const p=db.players[current];
  if(level>p.unlocked){alert("請先完成前面的關卡！");return}
  const pool=levelPool(level);
  if(!pool.length){alert("這一關還沒有題目，請到「題庫後台」新增，或檢查 questions.js。");return}
  activeLevel=level;quizMode="level";
  quizItems=shuffle(pool).slice(0,25);qIndex=0;rightCount=0;beginQuiz();
}
function startReview(){
  const list=eligibleWrongItems(db.players[current]);
  if(!list.length){alert("目前沒有可複習的錯題。");return}
  quizMode="review";
  quizItems=shuffle(list.map(x=>({id:x.id,item:getQ(x.id),sourceLevel:x.sourceLevel})));
  activeLevel=0;qIndex=0;rightCount=0;beginQuiz();
}
function beginQuiz(){hidePages();document.getElementById("quizPage").classList.remove("hidden");renderQuestion()}
function renderQuestion(){
  answered=false;
  const entry=quizItems[qIndex],item=entry.item,$=id=>document.getElementById(id);
  $("quizLevel").textContent=quizMode==="review"?`錯題複習｜原第 ${entry.sourceLevel} 關`:`第 ${activeLevel} 關｜${LEVEL_NAMES[activeLevel-1]}`;
  $("quizTitle").textContent=quizMode==="review"?"📚 錯題重新挑戰":"聖經知識挑戰";
  $("questionCount").textContent=`第 ${qIndex+1} / ${quizItems.length} 題`;
  $("quizScore").textContent=`本次答對 ${rightCount} 題（${rightCount*10}分）｜累積 ${getScore(db.players[current])} 分`;
  $("progressBar").style.width=(qIndex/quizItems.length*100)+"%";
  $("questionText").textContent=item[0];
  $("feedback").classList.add("hidden");
  const opts=shuffle([{text:item[1],correct:true},{text:item[2],correct:false},{text:item[3],correct:false},{text:item[4],correct:false}]);
  const box=$("options");box.innerHTML="";
  opts.forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.textContent=["A. ","B. ","C. ","D. "][i]+o.text;b.onclick=()=>chooseAnswer(i,opts);box.appendChild(b)});
  $("nextBtn").disabled=true;$("nextBtn").textContent="確認答案";
}
function chooseAnswer(i,opts){
  if(answered)return;
  const entry=quizItems[qIndex],item=entry.item,p=db.players[current],ok=opts[i].correct;
  answered=true;
  if(ok){rightCount++;delete p.wrongQuestions[entry.id]}else p.wrongQuestions[entry.id]={sourceLevel:entry.sourceLevel};
  saveDB();
  [...document.querySelectorAll(".option")].forEach((b,j)=>{if(opts[j].correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong");b.disabled=true});
  const fb=document.getElementById("feedback");fb.classList.remove("hidden");
  const exp=item[5]?`<br>${escapeHTML(item[5])}`:"";
  fb.innerHTML=ok?`<strong style="color:#68dda0">✓ 答對了！</strong>${exp}`:`<strong style="color:#ff8181">✗ 再加油！</strong><br>正確答案：${escapeHTML(item[1])}${exp}`;
  document.getElementById("nextBtn").disabled=false;
  document.getElementById("nextBtn").textContent=qIndex===quizItems.length-1?(quizMode==="review"?"完成複習":"完成本關"):"下一題";
  document.getElementById("quizScore").textContent=`本次答對 ${rightCount} 題（${rightCount*10}分）｜累積 ${getScore(p)} 分`;
}
function nextQuestion(){
  if(!answered)return;
  qIndex++;
  if(qIndex<quizItems.length){renderQuestion();return}
  quizMode==="review"?finishReview():finishLevel();
}
function finishLevel(){
  const p=db.players[current],old=p.records[activeLevel]||{right:0,score:0},earned=rightCount*10,total=quizItems.length;
  const pass=rightCount>=Math.ceil(total*0.8);
  p.records[activeLevel]={right:Math.max(old.right,rightCount),score:Math.max(old.score,earned),total:Math.max(old.total||0,total),completed:true};
  if(pass&&activeLevel<10)p.unlocked=Math.max(p.unlocked,activeLevel+1);
  saveDB();
  hidePages();document.getElementById("resultPage").classList.remove("hidden");
  document.getElementById("resultTitle").textContent=pass?"🎉 關卡挑戰成功！":"💪 繼續努力！";
  document.getElementById("resultScore").textContent=`${rightCount} / ${total}`;
  const el=eligibleWrongItems(p).length,need=Math.ceil(total*0.8);
  document.getElementById("resultMessage").textContent=pass
    ?`答對 ${rightCount} 題，獲得 ${earned} 分！${activeLevel<10?"下一關已解鎖！":"恭喜完成全部十關！"}${el?`目前有 ${el} 題舊錯題可以複習。`:""}`
    :`答對 ${rightCount} 題。答對 ${need} 題即可解鎖下一關，再努力一次。`;
  renderAll();
}
function finishReview(){
  saveDB();hidePages();document.getElementById("resultPage").classList.remove("hidden");
  document.getElementById("resultTitle").textContent="📚 錯題複習完成";
  document.getElementById("resultScore").textContent=`${rightCount} / ${quizItems.length}`;
  document.getElementById("resultMessage").textContent=`本次複習答對 ${rightCount} 題。答對的錯題已從複習清單移除，答錯的題目會保留，下次可以再練習。複習不影響關卡積分。`;
  renderAll();
}
function confirmExit(){if(confirm("確定離開本次試煉？本次尚未完成的關卡成績不會計入紀錄。"))showLevels()}

/* ===== 後台 ===== */
function openAdmin(){
  const pin=prompt("請輸入後台密碼");
  if(pin===null)return;
  if(pin!==ADMIN_PIN){alert("密碼錯誤");return}
  hidePages();document.getElementById("adminPage").classList.remove("hidden");
  const sel=document.getElementById("aLevel");
  if(!sel.options.length)LEVEL_NAMES.forEach((n,i)=>sel.add(new Option(`第 ${i+1} 關｜${n}`,i+1)));
  clearForm();renderAdmin();
}
function clearForm(){
  editingId=null;
  ["aQ","aRight","aW1","aW2","aW3","aExp","aIO"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("aSave").textContent="＋ 新增題目";
}
function saveQuestion(){
  const v=id=>document.getElementById(id).value.trim();
  const q=v("aQ"),a=v("aRight"),w=[v("aW1"),v("aW2"),v("aW3")];
  if(!q||!a||w.some(x=>!x)){alert("題目、正確答案與 3 個錯誤答案都要填寫。");return}
  if(new Set([a,...w]).size<4){alert("四個選項不能重複。");return}
  const level=Number(document.getElementById("aLevel").value),exp=v("aExp");
  if(editingId){
    const c=custom.find(x=>x.id===editingId);
    if(c)Object.assign(c,{level,q,a,w,exp});
  }else custom.push({id:"c"+Date.now(),level,q,a,w,exp});
  if(!saveCustom())return;
  const lv=document.getElementById("aLevel").value;
  clearForm();document.getElementById("aLevel").value=lv;renderAdmin();
}
function editQuestion(id){
  const c=custom.find(x=>x.id===id);if(!c)return;
  editingId=id;
  document.getElementById("aLevel").value=c.level;
  document.getElementById("aQ").value=c.q;document.getElementById("aRight").value=c.a;
  document.getElementById("aW1").value=c.w[0];document.getElementById("aW2").value=c.w[1];document.getElementById("aW3").value=c.w[2];
  document.getElementById("aExp").value=c.exp||"";
  document.getElementById("aSave").textContent="✓ 儲存修改";
  window.scrollTo({top:0,behavior:"smooth"});
}
function deleteQuestion(id){
  if(!confirm("確定刪除這題？"))return;
  custom=custom.filter(x=>x.id!==id);
  Object.values(db.players).forEach(p=>delete p.wrongQuestions[id]);
  saveCustom();saveDB();if(editingId===id)clearForm();renderAdmin();
}
function renderAdmin(){
  document.getElementById("aCount").textContent=custom.length;
  const box=document.getElementById("aList");box.innerHTML="";
  if(!custom.length){box.innerHTML='<div class="small" style="margin-top:8px">沒有待寫入的新題目</div>';return}
  custom.slice().sort((a,b)=>a.level-b.level).forEach(c=>{
    const d=document.createElement("div");d.className="qitem";
    d.innerHTML=`<div><span class="small">第${c.level}關</span><br>${escapeHTML(c.q)}<br><span class="small">✅ ${escapeHTML(c.a)}</span></div>`;
    const e=document.createElement("button");e.className="btn2";e.textContent="編輯";e.onclick=()=>editQuestion(c.id);
    const x=document.createElement("button");x.className="btnDanger";x.textContent="刪除";x.onclick=()=>deleteQuestion(c.id);
    d.append(e,x);box.appendChild(d);
  });
}
function mergeDuplicates(){
  let changed=false;
  custom=custom.filter(c=>{
    const i=baseRaw.findIndex((it,k)=>it[0]===c.q&&baseLevel(k)===c.level);
    if(i<0)return true;
    Object.values(db.players).forEach(p=>{if(p.wrongQuestions[c.id]){p.wrongQuestions[i]=p.wrongQuestions[c.id];delete p.wrongQuestions[c.id]}});
    changed=true;return false;
  });
  if(changed){saveCustom();saveDB()}
}
function buildFile(list){
  const lines=list.map(it=>"  "+JSON.stringify([it[0],it[1],it[2],it[3],it[4],it[5]||"",it[6]]));
  return "/*\n題庫檔 questions.js\n格式：[題目,正確答案,錯誤答案1,錯誤答案2,錯誤答案3,解說,關卡]\n此檔可由 index.html 的「題庫後台」自動寫入。\n*/\nconst raw=[\n"+lines.join(",\n")+"\n];\n";
}
async function writeQuestionsFile(){
  if(!custom.length&&!confirm("目前沒有新題目，仍要重新寫入 questions.js 嗎？"))return;
  const merged=baseRaw.map((it,i)=>[it[0],it[1],it[2],it[3],it[4],it[5]||"",baseLevel(i)]);
  custom.forEach(c=>merged.push([c.q,c.a,c.w[0],c.w[1],c.w[2],c.exp||"",c.level]));
  const text=buildFile(merged);
  try{
    if(window.showSaveFilePicker){
      const h=await showSaveFilePicker({suggestedName:"questions.js",types:[{description:"JavaScript",accept:{"text/javascript":[".js"]}}]});
      const w=await h.createWritable();await w.write(text);await w.close();
      baseRaw=merged;mergeDuplicates();clearForm();renderAdmin();
      alert("已寫入 questions.js！共 "+merged.length+" 題。");
    }else{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([text],{type:"text/javascript"}));
      a.download="questions.js";a.click();
      alert("已下載新的 questions.js（共 "+merged.length+" 題），請用它取代原本的檔案，重新整理後新題目就會併入題庫。");
    }
  }catch(e){if(e&&e.name!=="AbortError")alert("寫入失敗："+e.message)}
}
function exportQ(){
  const t=document.getElementById("aIO");t.value=JSON.stringify(custom);t.select();
  try{document.execCommand("copy")}catch(e){}
}
function importQ(){
  try{
    const arr=JSON.parse(document.getElementById("aIO").value);
    if(!Array.isArray(arr))throw 0;
    let n=0;
    arr.forEach(c=>{
      if(c&&c.q&&c.a&&Array.isArray(c.w)&&c.w.length===3&&c.level>=1&&c.level<=10&&!custom.some(x=>x.q===c.q&&x.level===c.level)){
        custom.push({id:"c"+Date.now()+n,level:Number(c.level),q:c.q,a:c.a,w:c.w,exp:c.exp||""});n++;
      }
    });
    saveCustom();renderAdmin();alert(`已匯入 ${n} 題。`);
  }catch(e){alert("備份內容格式不正確。")}
}

document.getElementById("playerName").addEventListener("focus",function(){
  if(this.dataset.keepValue==="1"){delete this.dataset.keepValue;return}
  this.value="";
});
renderAll();
</script>
